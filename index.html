<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Rustrans</title>
  <style>
    :root {
      --text:#1d1d1f;
      --sub:#6e6e73;
    }
    * { box-sizing:border-box; }
    html {
      height:100%;
    }
    html, body {
      margin:0;
      min-height:100%;
      min-height:100vh;
      min-height:100dvh;
      color:var(--text);
      font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing:antialiased;
      background-color:#e8e9ee;
      background-image:
        radial-gradient(1100px 520px at 50% -8%, #fff 0%, transparent 58%),
        radial-gradient(720px 420px at 100% 8%, rgba(11,28,51,.08), transparent 55%),
        radial-gradient(640px 380px at 0% 100%, rgba(227,6,19,.07), transparent 50%),
        linear-gradient(180deg, #f5f5f7 0%, #e8e9ee 100%);
      background-attachment:fixed;
      background-repeat:no-repeat;
      background-size:cover;
    }
    body { padding:40px 20px 64px; }
    .stage { width:min(860px, 100%); margin:0 auto; }
    .top {
      display:flex;
      align-items:stretch;
      justify-content:space-between;
      gap:16px;
      margin-bottom:44px;
    }
    .plate {
      background:#fff;
      border-radius:32px;
      box-shadow:
        0 1px 0 rgba(255,255,255,.8) inset,
        0 18px 50px rgba(11,28,51,.12),
        0 4px 12px rgba(11,28,51,.06);
    }
    .logo-plate {
      display:flex;
      align-items:center;
      padding:18px 24px;
    }
    .logo-plate img {
      height:64px;
      width:auto;
      display:block;
    }
    .clock-plate {
      padding:14px 26px 16px;
      min-width:240px;
      text-align:right;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }
    .time {
      margin:0;
      font-size:42px;
      font-weight:600;
      letter-spacing:-.045em;
      line-height:1;
      font-variant-numeric:tabular-nums;
      color:#1d1d1f;
    }
    .date {
      margin:6px 0 0;
      font-size:15px;
      font-weight:400;
      letter-spacing:-.01em;
      color:var(--sub);
      text-transform:capitalize;
    }
    .fx {
      display:none;
      margin:4px 0 0;
      font-size:15px;
      font-weight:500;
      letter-spacing:-.02em;
      font-variant-numeric:tabular-nums;
      color:var(--text);
    }
    .fx.show { display:block; }
    .fx-dir {
      display:inline-block;
      margin-left:5px;
      font-size:11px;
      line-height:1;
      vertical-align:2px;
    }
    .fx-dir.up { color:#ff3b30; }
    .fx-dir.down { color:#34c759; }
    .fx small {
      margin-left:6px;
      font-size:12px;
      font-weight:400;
      color:var(--sub);
    }
    .status {
      margin:4px 0 0;
      font-size:12px;
      font-weight:600;
      letter-spacing:-.01em;
      color:#34c759;
    }
    .status.off { color:#ff9f0a; }
    nav.apps {
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:22px 10px;
      justify-items:center;
    }
    a.app {
      display:flex;
      flex-direction:column;
      align-items:center;
      width:100%;
      text-decoration:none;
      color:var(--text);
      -webkit-tap-highlight-color:transparent;
    }
    a.app:focus-visible { outline:none; }
    a.app:focus-visible .icon {
      box-shadow:0 0 0 4px #fff, 0 0 0 6px #0071e3;
    }
    .icon {
      width:96px;
      height:96px;
      border-radius:22.37%;
      overflow:hidden;
      box-shadow:
        0 0 0 .5px rgba(0,0,0,.04),
        0 10px 28px rgba(0,0,0,.14);
      transition:transform .22s cubic-bezier(.22,1,.36,1);
    }
    .icon svg, .icon img { width:100%; height:100%; display:block; }
    .icon img { object-fit:cover; }
    a.app:hover .icon { transform:scale(1.06); }
    a.app:active .icon { transform:scale(.96); }
    .name {
      margin:10px 0 0;
      font-size:15px;
      font-weight:600;
      letter-spacing:-.02em;
      text-align:center;
    }
    .dock {
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:32px 22px;
      margin-top:56px;
      padding-top:28px;
      border-top:1px solid rgba(60,60,67,.12);
    }
    .dock .app { width:88px; flex:0 0 auto; }
    .dock .icon { width:64px; height:64px; }
    .dock .name { font-size:12px; font-weight:400; color:var(--sub); }
    @media (max-width:700px) {
      .top { flex-direction:column; }
      .clock-plate { text-align:left; min-width:0; }
      .time { font-size:36px; }
      .logo-plate img { height:52px; }
      nav.apps { grid-template-columns:repeat(2, 1fr); gap:28px 16px; }
      .icon { width:84px; height:84px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .icon { transition:none; }
      a.app:hover .icon, a.app:active .icon { transform:none; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <header class="top">
      <div class="plate logo-plate">
        <img src="logo.png" alt="Rustrans-Logistic.ru" />
      </div>
      <div class="plate clock-plate" aria-live="polite">
        <p class="time" id="time">--:--</p>
        <p class="date" id="date"></p>
        <p class="fx" id="fx"></p>
        <p class="status" id="status"></p>
      </div>
    </header>

    <nav class="apps" aria-label="Сервисы">
      <a class="app" href="https://carownertop.github.io/rustrans-analytics-view/">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 100 100">
            <defs><linearGradient id="g-an" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2c2e"/><stop offset="1" stop-color="#1c1c1e"/></linearGradient></defs>
            <rect width="100" height="100" fill="url(#g-an)"/>
            <rect x="22" y="58" width="14" height="22" rx="3.5" fill="#fff"/>
            <rect x="43" y="40" width="14" height="40" rx="3.5" fill="#fff"/>
            <rect x="64" y="28" width="14" height="52" rx="3.5" fill="#34c759"/>
          </svg>
        </span>
        <span class="name">Аналитика</span>
      </a>
      <a class="app" href="https://carownertop.github.io/rustrans-prices-view/">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 100 100">
            <defs><linearGradient id="g-co" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff453a"/><stop offset="1" stop-color="#d70015"/></linearGradient></defs>
            <rect width="100" height="100" fill="url(#g-co)"/>
            <circle cx="34" cy="52" r="16" fill="none" stroke="#fff" stroke-width="7"/>
            <circle cx="66" cy="52" r="16" fill="none" stroke="#fff" stroke-width="7"/>
            <rect x="43" y="36" width="14" height="7" rx="3.5" fill="#fff"/>
            <circle cx="34" cy="52" r="5.5" fill="#fff"/>
            <circle cx="66" cy="52" r="5.5" fill="#fff"/>
          </svg>
        </span>
        <span class="name">Конкуренты</span>
      </a>
      <a class="app" href="https://carownertop.github.io/rustrans-send-view/">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 100 100">
            <defs><linearGradient id="g-pr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a84ff"/><stop offset="1" stop-color="#0071e3"/></linearGradient></defs>
            <rect width="100" height="100" fill="url(#g-pr)"/>
            <rect x="27" y="20" width="46" height="60" rx="10" fill="#fff"/>
            <rect x="36" y="36" width="28" height="5" rx="2.5" fill="#0071e3"/>
            <rect x="36" y="47" width="28" height="5" rx="2.5" fill="#0071e3"/>
            <rect x="36" y="58" width="18" height="5" rx="2.5" fill="#0071e3"/>
          </svg>
        </span>
        <span class="name">Прайс RTL</span>
      </a>
      <a class="app" href="https://carownertop.github.io/rustrans-stock/">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 100 100">
            <defs><linearGradient id="g-st" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9f0a"/><stop offset="1" stop-color="#c93400"/></linearGradient></defs>
            <rect width="100" height="100" fill="url(#g-st)"/>
            <path fill="#fff" d="M50 22 78 37v26L50 78 22 63V37L50 22Z"/>
            <path fill="#c93400" opacity=".35" d="M50 50 78 37v26L50 78V50Z"/>
            <path stroke="#fff" stroke-width="3" d="M22 37 50 50 78 37"/>
            <path stroke="#fff" stroke-width="3" d="M50 50v28"/>
          </svg>
        </span>
        <span class="name">Склад</span>
      </a>
    </nav>

    <nav class="dock" aria-label="Сайт, почта и ИИ">
      <a class="app" href="https://rustrans-logistic.ru/" target="_blank" rel="noopener">
        <span class="icon" aria-hidden="true">
          <img src="rtl-site-2.png" alt="" />
        </span>
        <span class="name">Сайт RTL</span>
      </a>
      <a class="app" href="https://auto-oil.bitrix24.ru/" target="_blank" rel="noopener">
        <span class="icon" aria-hidden="true">
          <img src="bitrix24.png" alt="" />
        </span>
        <span class="name">Bitrix24</span>
      </a>
      <a class="app" href="https://mail.yandex.ru/" target="_blank" rel="noopener">
        <span class="icon" aria-hidden="true">
          <img src="yandex-mail.png" alt="" />
        </span>
        <span class="name">Почта</span>
      </a>
      <a class="app" href="https://telemost.yandex.ru/" target="_blank" rel="noopener">
        <span class="icon" aria-hidden="true">
          <img src="telemost.png" alt="" />
        </span>
        <span class="name">Телемост</span>
      </a>
      <a class="app" href="https://chatgpt.com/" target="_blank" rel="noopener">
        <span class="icon" aria-hidden="true">
          <img src="chatgpt.png" alt="" />
        </span>
        <span class="name">ChatGPT</span>
      </a>
      <a class="app" href="https://claude.ai/" target="_blank" rel="noopener">
        <span class="icon" aria-hidden="true">
          <img src="claude.png" alt="" />
        </span>
        <span class="name">Claude</span>
      </a>
    </nav>
  </div>
  <script>
    const TZ = "Europe/Moscow";
    const OFF = new Set("2026-01-01,2026-01-02,2026-01-03,2026-01-04,2026-01-05,2026-01-06,2026-01-07,2026-01-08,2026-01-09,2026-01-10,2026-01-11,2026-01-17,2026-01-18,2026-01-24,2026-01-25,2026-01-31,2026-02-01,2026-02-07,2026-02-08,2026-02-14,2026-02-15,2026-02-21,2026-02-22,2026-02-23,2026-02-28,2026-03-01,2026-03-07,2026-03-08,2026-03-09,2026-03-14,2026-03-15,2026-03-21,2026-03-22,2026-03-28,2026-03-29,2026-04-04,2026-04-05,2026-04-11,2026-04-12,2026-04-18,2026-04-19,2026-04-25,2026-04-26,2026-05-01,2026-05-02,2026-05-03,2026-05-09,2026-05-10,2026-05-11,2026-05-16,2026-05-17,2026-05-23,2026-05-24,2026-05-30,2026-05-31,2026-06-06,2026-06-07,2026-06-12,2026-06-13,2026-06-14,2026-06-20,2026-06-21,2026-06-27,2026-06-28,2026-07-04,2026-07-05,2026-07-11,2026-07-12,2026-07-18,2026-07-19,2026-07-25,2026-07-26,2026-08-01,2026-08-02,2026-08-08,2026-08-09,2026-08-15,2026-08-16,2026-08-22,2026-08-23,2026-08-29,2026-08-30,2026-09-05,2026-09-06,2026-09-12,2026-09-13,2026-09-19,2026-09-20,2026-09-26,2026-09-27,2026-10-03,2026-10-04,2026-10-10,2026-10-11,2026-10-17,2026-10-18,2026-10-24,2026-10-25,2026-10-31,2026-11-01,2026-11-04,2026-11-07,2026-11-08,2026-11-14,2026-11-15,2026-11-21,2026-11-22,2026-11-28,2026-11-29,2026-12-05,2026-12-06,2026-12-12,2026-12-13,2026-12-19,2026-12-20,2026-12-26,2026-12-27,2026-12-31".split(","));
    const timeEl = document.getElementById("time");
    const dateEl = document.getElementById("date");
    const fxEl = document.getElementById("fx");
    const statusEl = document.getElementById("status");
    let lastIso = "";

    async function loadUsd() {
      const urls = [
        "https://www.cbr-xml-daily.ru/daily_json.js",
        "https://www.cbr-xml-daily.com/daily_json.js"
      ];
      for (const url of urls) {
        try {
          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) continue;
          const data = await res.json();
          const usd = data && data.Valute && data.Valute.USD;
          if (!usd) continue;
          const rate = Number(usd.Value) / Number(usd.Nominal || 1);
          const prev = Number(usd.Previous) / Number(usd.Nominal || 1);
          if (!Number.isFinite(rate)) continue;
          const pretty = rate.toLocaleString("ru-RU", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          });
          const nodes = [document.createTextNode("$ " + pretty + " ₽")];
          if (Number.isFinite(prev)) {
            const delta = rate - prev;
            if (Math.abs(delta) >= 0.005) {
              const dir = document.createElement("span");
              dir.className = "fx-dir " + (delta > 0 ? "up" : "down");
              dir.textContent = delta > 0 ? "▲" : "▼";
              dir.title = (delta > 0 ? "+" : "") + delta.toLocaleString("ru-RU", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
              }) + " ₽ к предыдущему курсу ЦБ";
              nodes.push(dir);
            }
          }
          nodes.push(Object.assign(document.createElement("small"), { textContent: "ЦБ РФ" }));
          fxEl.replaceChildren(...nodes);
          fxEl.classList.add("show");
          return;
        } catch (e) {}
      }
    }

    function tick() {
      const now = new Date();
      timeEl.textContent = new Intl.DateTimeFormat("ru-RU", {
        timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false
      }).format(now);
      dateEl.textContent = new Intl.DateTimeFormat("ru-RU", {
        timeZone: TZ, weekday: "long", day: "numeric", month: "long"
      }).format(now);
      const iso = new Intl.DateTimeFormat("en-CA", {
        timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit"
      }).format(now);
      const off = OFF.has(iso);
      statusEl.textContent = off ? "Выходной · МСК" : "Рабочий день · МСК";
      statusEl.classList.toggle("off", off);
      if (iso !== lastIso) {
        lastIso = iso;
        loadUsd();
      }
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
